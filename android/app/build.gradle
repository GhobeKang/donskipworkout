apply plugin: 'com.android.application'

def keystore_properties = new Properties()
def keystore_properties_file = rootProject.file('keystore/keystore.properties')
if (keystore_properties_file.isFile()) {
    keystore_properties_file.withInputStream { keystore_properties.load(it) }
}
def signing_values = [
    storeFile: System.getenv('DONSKIP_KEYSTORE_FILE') ?: keystore_properties.getProperty('storeFile'),
    storePassword: System.getenv('DONSKIP_KEYSTORE_PASSWORD') ?: keystore_properties.getProperty('storePassword'),
    keyAlias: System.getenv('DONSKIP_KEY_ALIAS') ?: keystore_properties.getProperty('keyAlias'),
    keyPassword: System.getenv('DONSKIP_KEY_PASSWORD') ?: keystore_properties.getProperty('keyPassword')
]

android {
    namespace "com.donskip.attendancecheck"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.donskip.attendancecheck"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signing_values.storeFile) {
                storeFile rootProject.file(signing_values.storeFile)
            }
            storePassword signing_values.storePassword
            keyAlias signing_values.keyAlias
            keyPassword signing_values.keyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { build_task ->
    if (build_task.name in ['preReleaseBuild', 'validateSigningRelease', 'signReleaseBundle']) {
        build_task.doFirst {
            def missing_fields = signing_values.findAll { property_name, property_value -> !property_value }.keySet()
            if (missing_fields) {
                throw new GradleException("Release signing is not configured. Set ${missing_fields.join(', ')} in android/keystore/keystore.properties or DONSKIP signing environment variables.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
