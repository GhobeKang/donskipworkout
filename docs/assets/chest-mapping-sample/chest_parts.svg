  },
  &quot;classification_note&quot;: &quot;윗·가운데·아랫가슴은 대흉근의 기록용 타겟 구역이다. 이 시안의 곡선 경계는 임상적으로 검증된 독립 근육 경계가 아니다.&quot;,
  &quot;side_note&quot;: &quot;원본 front path.left는 화면 왼쪽이다. 본 샘플의 side는 정면을 바라보는 사람의 해부학적 좌우로 정규화했다.&quot;,
