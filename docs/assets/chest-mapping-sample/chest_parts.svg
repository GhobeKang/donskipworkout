<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 275 350 190" role="img" aria-labelledby="chest_title chest_description">
  <title id="chest_title">가슴 좌우 상부·중부·하부 독립 파츠 샘플</title>
  <desc id="chest_description">원본 외곽을 유지한 여섯 개 닫힌 곡선 경로. 타겟 구역의 경계는 시안입니다.</desc>
