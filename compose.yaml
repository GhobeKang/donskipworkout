services:
  attendance_api:
    image: ${DOCKER_IMAGE_NAME:?Set DOCKER_IMAGE_NAME to a pushed Docker Hub image}
    env_file:
      - ./server/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
      LOG_FILE: /app/logs/api.log
      PHOTO_STORAGE_DIR: /app/media/photos
      NOTIFICATION_CATALOG_PATH: /app/notification-config/catalog.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - attendance_photo_storage:/app/media/photos
      - ./server/notification-config:/app/notification-config:ro
      - attendance_api_logs:/app/logs
    secrets:
      - firebase_service_account
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  attendance_photo_storage:
  attendance_api_logs:

secrets:
  firebase_service_account:
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE:?Set FIREBASE_SERVICE_ACCOUNT_FILE in the project-root .env or shell to the service-account JSON path on the deployment host}
