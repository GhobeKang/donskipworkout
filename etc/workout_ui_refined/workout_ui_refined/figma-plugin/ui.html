<!doctype html><html lang="ko"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f6f7f8;background:#10171b}h1{font-size:20px;margin:0 0 12px}p{color:#b6bdc5;margin:10px 0}.tag{display:inline-block;background:#322415;color:#ff9a33;padding:4px 9px;border-radius:6px;font-size:11px;margin-bottom:14px}button{font:inherit;font-weight:700;width:100%;border:0;border-radius:10px;padding:13px;cursor:pointer;background:#ff891f;color:#0b1013}button:disabled{opacity:.55;cursor:wait}.quiet{background:#202a32;color:#c2c8ce;margin-top:8px;padding:9px}.status{font-size:12px;min-height:40px;margin:13px 0;white-space:pre-wrap}.error{color:#ff8b84}.note{font-size:11px;color:#96a0aa}code{color:#f6f7f8}
</style><span class="tag">ORANGE REFERENCE · V2</span><h1>원본 비율로 UI 가져오기</h1><p>오늘 운동 · 운동 인증 · 기록 · 설정<br>텍스트, 아이콘, 카드, 사진을 분리된 레이어로 만듭니다.</p><p class="note">현재 페이지의 빈 영역에 생성합니다. 기존 프레임을 덮어쓰거나 삭제하지 않습니다. 외부 네트워크 요청은 없습니다. 손글씨와 캐릭터·사진은 원본 이미지 자산입니다.</p><button id="run">4개 화면 생성</button><div class="status" id="status">Noto Sans KR의 Regular / Medium / Bold / Black을 사용합니다.</div><button class="quiet" id="close">닫기</button><script>
const run=document.getElementById('run'),s=document.getElementById('status');
run.onclick=()=>{run.disabled=true;s.className='status';s.textContent='준비 중…';parent.postMessage({pluginMessage:{type:'import'}},'*')};
document.getElementById('close').onclick=()=>parent.postMessage({pluginMessage:{type:'close'}},'*');
window.onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;s.textContent=m.message||'';if(m.type==='done'){s.textContent+='\n텍스트 '+m.validation.texts+'개 · 공통 컴포넌트 '+m.validation.components+'개';run.textContent='완료';run.disabled=true;}if(m.type==='error'){s.className='status error';run.disabled=false;if(m.createdNodes)s.textContent+='\n생성 도중 중단된 영역은 선택되어 있습니다. 필요하면 Undo 후 다시 실행해주세요.';}};
</script></html>
